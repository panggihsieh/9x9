<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b141c">
  <meta name="description" content="限時因數、因數配對與質因數分解互動測驗遊戲。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="因數互動板">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>因數分解互動板</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071018;
      --panel: #101b26;
      --panel-2: #142433;
      --line: #294055;
      --text: #f7fbff;
      --muted: #a8bed0;
      --blue: #50a9ff;
      --green: #63df93;
      --pink: #f79bdc;
      --yellow: #ffd86a;
      --orange: #ffb650;
      --danger: #ff5c6c;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
      background:
        radial-gradient(circle at 16% 10%, rgba(80, 169, 255, .18), transparent 28rem),
        radial-gradient(circle at 86% 80%, rgba(99, 223, 147, .12), transparent 24rem),
        linear-gradient(135deg, #070d13 0%, #0b141c 48%, #05090d 100%);
      color: var(--text);
    }

    button { font: inherit; }

    .app {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 30px 34px 28px;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 22px;
      align-items: start;
      margin-bottom: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .logo {
      width: 90px;
      height: 90px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      padding: 10px;
      border-radius: 16px;
      background: #18324a;
      box-shadow: 0 14px 30px rgba(0, 0, 0, .35), inset 0 0 0 2px rgba(255,255,255,.06);
    }

    .logo span {
      display: grid;
      place-items: center;
      border-radius: 7px;
      font-size: 30px;
      font-weight: 900;
      line-height: 1;
      text-shadow: 0 2px 0 rgba(0,0,0,.25);
    }

    .logo span:nth-child(1),
    .logo span:nth-child(3) { background: #1b91f2; }
    .logo span:nth-child(2) { background: #48617a; }
    .logo span:nth-child(4) { background: #ff9f37; }

    h1 {
      margin: 0;
      font-size: clamp(38px, 4.7vw, 68px);
      letter-spacing: 0;
      line-height: 1;
    }

    h1 b { color: var(--blue); }

    .subtitle {
      margin-top: 10px;
      color: #c8d8e5;
      font-size: clamp(18px, 2vw, 26px);
      letter-spacing: 1px;
    }

    .mode-switch {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .mode-switch button {
      min-height: 44px;
      padding: 0 18px;
      border: 1px solid #35516c;
      border-radius: 999px;
      color: #d8eaff;
      background: #132232;
      cursor: pointer;
      font-weight: 900;
    }

    .mode-switch button.active {
      color: #06131f;
      border-color: transparent;
      background: linear-gradient(180deg, #a9d7ff, #4aa6ff);
    }

    .status-panel {
      min-width: 560px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      padding: 10px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: rgba(14, 25, 36, .86);
      box-shadow: 0 10px 28px rgba(0,0,0,.28);
    }

    .meter {
      min-height: 76px;
      padding: 12px 14px;
      border-radius: 16px;
      background: #0d1722;
      border: 1px solid rgba(255,255,255,.08);
    }

    .meter label {
      display: block;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 6px;
    }

    .meter strong {
      font-size: 30px;
      line-height: 1;
    }

    .timer strong,
    .round-timer strong { color: var(--yellow); }
    .timer.danger,
    .round-timer.danger { animation: pulseDanger .55s infinite alternate; }

    main {
      display: grid;
      grid-template-columns: minmax(540px, 1fr) minmax(540px, 700px);
      gap: 22px;
      align-items: start;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(10, minmax(0, 1fr));
      gap: 10px;
    }

    .number {
      aspect-ratio: 1.28 / 1;
      border: 0;
      border-radius: 8px;
      color: var(--text);
      background: linear-gradient(180deg, #26313a, #172027);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), 0 7px 13px rgba(0,0,0,.33);
      font-size: clamp(18px, 1.8vw, 26px);
      font-weight: 900;
      cursor: pointer;
      transition: transform .12s ease, background .12s ease, box-shadow .12s ease;
    }

    .number:hover,
    .number:focus-visible {
      transform: translateY(-2px);
      outline: none;
      box-shadow: inset 0 0 0 2px rgba(80,169,255,.55), 0 10px 18px rgba(0,0,0,.42);
    }

    .number.selected {
      color: #fff;
      background: linear-gradient(180deg, #72c0ff, #2b91ef);
      box-shadow: 0 0 0 3px rgba(80, 169, 255, .28), 0 12px 22px rgba(38, 144, 239, .38);
    }

    .number.answer-source {
      cursor: grab;
    }

    .side {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(13, 22, 31, .92);
      box-shadow: 0 18px 45px rgba(0, 0, 0, .32);
      padding: 18px 18px 16px;
    }

    .prompt {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 18px;
      align-items: center;
      margin-bottom: 14px;
    }

    .target-card {
      display: grid;
      place-items: center;
      width: 178px;
      height: 116px;
      border-radius: 11px;
      background: linear-gradient(180deg, #78c2ff, #3997f5);
      box-shadow: inset 0 -8px 0 rgba(0,0,0,.09), 0 14px 28px rgba(45, 143, 242, .26);
      font-size: 74px;
      font-weight: 1000;
    }

    .speech {
      min-height: 96px;
      display: flex;
      align-items: center;
      padding: 18px 22px;
      color: #eef7ff;
      border: 2px solid #315784;
      border-radius: 25px;
      background: linear-gradient(135deg, #1c3655, #173049);
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 800;
      line-height: 1.45;
    }

    .section {
      margin-top: 10px;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(22, 38, 51, .9), rgba(13, 24, 34, .9));
    }

    .section.active-task {
      border-color: var(--yellow);
      box-shadow: 0 0 0 2px rgba(255, 216, 106, .2);
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 23px;
      font-weight: 950;
    }

    .badge {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      color: #fff;
      background: #f21637;
      font-size: 17px;
      box-shadow: 0 0 0 3px #fff;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--blue);
      box-shadow: 0 0 18px currentColor;
    }

    .green { color: var(--green); }
    .pink { color: var(--pink); }
    .green .dot { background: var(--green); }
    .pink .dot { background: var(--pink); }

    .hint {
      color: var(--muted);
      font-size: 15px;
      text-align: right;
    }

    .chips,
    .pair-list,
    .answer-row,
    .equation {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .chip,
    .pair,
    .answer-token,
    .factor-box {
      min-width: 68px;
      height: 54px;
      display: inline-grid;
      place-items: center;
      border-radius: 9px;
      font-size: 26px;
      font-weight: 950;
      line-height: 1;
    }

    .chip {
      border: 0;
      color: #071521;
      background: linear-gradient(180deg, #cfe5ff, #90c5ff);
      box-shadow: 0 5px 12px rgba(0,0,0,.24);
    }

    .pair {
      min-width: 144px;
      color: #0a2819;
      background: linear-gradient(180deg, #dcffe6, #9ef6c0);
    }

    .equation {
      justify-content: center;
      min-height: 66px;
      font-size: clamp(29px, 3vw, 44px);
      font-weight: 1000;
    }

    .factor-box,
    .answer-token {
      color: #071521;
      background: linear-gradient(180deg, #ffd37c, #ffb144);
      box-shadow: 0 5px 12px rgba(0,0,0,.2);
    }

    .factor-box.prime,
    .answer-token.prime {
      background: linear-gradient(180deg, #ffc4ed, #ee8dda);
    }

    .quiz-zone {
      min-height: 74px;
      padding: 10px;
      border: 2px dashed #5c7895;
      border-radius: 10px;
      background: #09131e;
    }

    .quiz-zone.empty::before {
      content: attr(data-placeholder);
      color: #6f8aa4;
      font-size: 18px;
      font-weight: 800;
    }

    .answer-token {
      cursor: pointer;
    }

    .task-actions {
      display: grid;
      grid-template-columns: 1fr auto auto auto auto;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
    }

    .task-note {
      min-height: 28px;
      color: #cbe0ef;
      font-size: 16px;
      font-weight: 800;
    }

    .task-note.good { color: var(--green); }
    .task-note.bad { color: var(--danger); }

    .confirm,
    .clear,
    .task-start {
      min-height: 42px;
      padding: 0 16px;
      border-radius: 999px;
      border: 0;
      color: #06131f;
      background: linear-gradient(180deg, #d7ebff, #86c5ff);
      cursor: pointer;
      font-weight: 950;
    }

    .clear {
      color: #e8f3ff;
      border: 1px solid #375674;
      background: #152638;
    }

    .task-start {
      color: #071521;
      background: linear-gradient(180deg, #fff4a7, #ffd15d);
    }

    .task-timer {
      min-height: 42px;
      display: inline-grid;
      place-items: center;
      padding: 0 14px;
      border-radius: 999px;
      color: #071521;
      background: linear-gradient(180deg, #dff0ff, #9dd0ff);
      font-weight: 1000;
    }

    .task-timer.danger {
      color: #fff;
      background: linear-gradient(180deg, #ff7885, #d91d39);
      animation: pulseDanger .55s infinite alternate;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .primary,
    .secondary {
      min-height: 66px;
      border-radius: 999px;
      border: 0;
      color: #fff;
      font-size: 24px;
      font-weight: 950;
      cursor: pointer;
      box-shadow: 0 11px 22px rgba(0,0,0,.28);
    }

    .primary { background: linear-gradient(180deg, #46b8ff, #1679f1); }

    .secondary {
      background: linear-gradient(180deg, #263849, #172534);
      border: 1px solid #35516c;
    }

    .feedback {
      grid-column: 1 / -1;
      min-height: 28px;
      color: #cbe0ef;
      text-align: center;
      font-size: 18px;
      font-weight: 800;
    }

    .feedback.good { color: var(--green); }
    .feedback.bad { color: var(--danger); }

    .flash { animation: flash .38s ease; }
    .shake { animation: shake .28s ease; }

    .cheer-burst {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 10;
    }

    .cheer-word {
      position: absolute;
      left: 50%;
      top: 22%;
      transform: translate(-50%, -50%);
      padding: 14px 28px;
      border-radius: 999px;
      color: #06131f;
      background: linear-gradient(180deg, #fff6b7, #ffd86a);
      box-shadow: 0 18px 44px rgba(0, 0, 0, .35), 0 0 0 5px rgba(255, 255, 255, .18);
      font-size: clamp(32px, 5vw, 68px);
      font-weight: 1000;
      animation: cheerPop .95s ease forwards;
    }

    .confetti {
      position: absolute;
      left: 50%;
      top: 28%;
      width: 12px;
      height: 20px;
      border-radius: 3px;
      background: var(--blue);
      animation: confettiFly 1.05s ease-out forwards;
    }

    footer {
      display: grid;
      grid-template-columns: 1fr minmax(280px, 60%) 1fr;
      align-items: center;
      gap: 22px;
      margin-top: 24px;
      color: #7e98ad;
      font-size: 17px;
    }

    footer::before,
    footer::after {
      content: "";
      height: 1px;
      background: #2a3e50;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 20px;
      background: rgba(2, 7, 11, .72);
      z-index: 5;
    }

    .modal.open { display: grid; }

    .dialog {
      width: min(520px, 100%);
      padding: 30px;
      border-radius: 18px;
      border: 1px solid #31506c;
      background: #0f1c28;
      box-shadow: 0 30px 90px rgba(0,0,0,.55);
      text-align: center;
    }

    .dialog h2 {
      margin: 0 0 12px;
      font-size: 42px;
    }

    .dialog p {
      color: #c7d8e7;
      font-size: 20px;
      line-height: 1.6;
    }

    @keyframes pulseDanger {
      from { box-shadow: inset 0 0 0 1px rgba(255,92,108,.26); }
      to { box-shadow: inset 0 0 0 2px rgba(255,92,108,.82), 0 0 20px rgba(255,92,108,.35); }
    }

    @keyframes flash {
      0% { filter: brightness(1); }
      50% { filter: brightness(1.48); }
      100% { filter: brightness(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      75% { transform: translateX(7px); }
    }

    @keyframes cheerPop {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(.6); }
      18% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
      70% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -82%) scale(.96); }
    }

    @keyframes confettiFly {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) rotate(0deg) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--dx)), var(--dy)) rotate(var(--rot)) scale(.8);
      }
    }

    @media (max-width: 1120px) {
      header,
      main { grid-template-columns: 1fr; }
      .status-panel { min-width: 0; }
    }

    @media (max-width: 680px) {
      .app { padding: 18px 14px 22px; }
      .brand { align-items: flex-start; }
      .logo {
        width: 62px;
        height: 62px;
        border-radius: 12px;
        padding: 7px;
      }
      .logo span { font-size: 20px; }
      .status-panel { grid-template-columns: 1fr; }
      .board {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
      }
      .prompt { grid-template-columns: 1fr; }
      .target-card {
        width: 100%;
        height: 102px;
      }
      .section-head,
      .task-actions {
        align-items: stretch;
        grid-template-columns: 1fr;
        flex-direction: column;
      }
      .hint { text-align: left; }
      .controls { grid-template-columns: 1fr; }
      footer {
        grid-template-columns: 1fr;
        text-align: center;
      }
      footer::before,
      footer::after { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <span>×</span><span>÷</span><span>+</span><span>−</span>
        </div>
        <div>
          <h1>因數分解 <b>互動板</b></h1>
          <div class="subtitle">第一版教學示範，第二版遊戲測驗。</div>
          <div class="mode-switch" aria-label="版本切換">
            <button type="button" id="demoMode" class="active">第一版：教學示範</button>
            <button type="button" id="quizMode">第二版：遊戲測驗</button>
          </div>
        </div>
      </div>
      <div class="status-panel" aria-live="polite">
        <div class="meter timer" id="timerBox">
          <label>剩餘時間</label>
          <strong><span id="time">60</span>s</strong>
        </div>
        <div class="meter round-timer" id="roundTimerBox">
          <label>本題時間</label>
          <strong><span id="roundTime">35</span>s</strong>
        </div>
        <div class="meter">
          <label>分數</label>
          <strong id="score">0</strong>
        </div>
        <div class="meter">
          <label>連擊</label>
          <strong><span id="streak">0</span>x</strong>
        </div>
        <div class="meter">
          <label>題數</label>
          <strong><span id="roundCount">0</span></strong>
        </div>
      </div>
    </header>

    <main>
      <section class="board" id="board" aria-label="1 到 100 數字板"></section>

      <aside class="side">
        <div class="prompt">
          <div class="target-card" id="target">24</div>
          <div class="speech" id="speech">一起找出 24 的因數與質因數分解吧！</div>
        </div>

        <section class="section" id="factorSection" data-task="factors">
          <div class="section-head">
            <div class="title"><span class="dot"></span>因數 <span class="badge">1</span></div>
            <div class="hint" id="factorHint">找出所有可以整除目標數的數。</div>
          </div>
          <div id="factorContent"></div>
          <div class="task-actions" data-actions="factors"></div>
        </section>

        <section class="section" id="pairSection" data-task="pairs">
          <div class="section-head">
            <div class="title green"><span class="dot"></span>因數配對 <span class="badge">2</span></div>
            <div class="hint">完成所有相乘會得到目標數的配對。</div>
          </div>
          <div id="pairContent"></div>
          <div class="task-actions" data-actions="pairs"></div>
        </section>

        <section class="section" id="primeSection" data-task="primes">
          <div class="section-head">
            <div class="title pink"><span class="dot"></span>質因數分解 <span class="badge">3</span></div>
            <div class="hint">把目標數寫成質數的乘積。</div>
          </div>
          <div id="primeContent"></div>
          <div class="task-actions" data-actions="primes"></div>
        </section>

        <div class="controls">
          <button class="primary" id="newRound">↻ 再選一個數字</button>
          <button class="secondary" id="startGame">▶ 開始測驗</button>
          <button class="secondary" id="muteToggle">🔊 音效開</button>
          <div class="feedback" id="feedback">教學示範模式會直接顯示答案；切到遊戲測驗後，用左邊數字板作答。</div>
        </div>
      </aside>
    </main>

    <footer>
      <span>數學，讓世界更有規律！</span>
    </footer>
  </div>

  <div class="modal" id="modal">
    <div class="dialog">
      <h2>時間到！</h2>
      <p id="modalText"></p>
      <button class="primary" id="restart">再挑戰一次</button>
    </div>
  </div>

  <script>
    const board = document.querySelector("#board");
    const targetEl = document.querySelector("#target");
    const speech = document.querySelector("#speech");
    const feedback = document.querySelector("#feedback");
    const scoreEl = document.querySelector("#score");
    const streakEl = document.querySelector("#streak");
    const timeEl = document.querySelector("#time");
    const timerBox = document.querySelector("#timerBox");
    const roundTimeEl = document.querySelector("#roundTime");
    const roundTimerBox = document.querySelector("#roundTimerBox");
    const roundCountEl = document.querySelector("#roundCount");
    const modal = document.querySelector("#modal");
    const modalText = document.querySelector("#modalText");
    const demoModeButton = document.querySelector("#demoMode");
    const quizModeButton = document.querySelector("#quizMode");
    const muteToggle = document.querySelector("#muteToggle");
    const contentEls = {
      factors: document.querySelector("#factorContent"),
      pairs: document.querySelector("#pairContent"),
      primes: document.querySelector("#primeContent")
    };
    const actionEls = {
      factors: document.querySelector('[data-actions="factors"]'),
      pairs: document.querySelector('[data-actions="pairs"]'),
      primes: document.querySelector('[data-actions="primes"]')
    };

    const state = {
      mode: "demo",
      current: 24,
      score: 0,
      streak: 0,
      maxStreak: 0,
      time: 60,
      roundTime: 35,
      roundLimit: 35,
      roundCount: 0,
      active: false,
      timer: null,
      locked: false,
      audio: null,
      tickTone: 0,
      muted: false,
      runningTask: null,
      taskTimer: null,
      taskLimit: 35,
      taskTimes: { factors: 35, pairs: 35, primes: 35 },
      activeTask: "factors",
      draggedValue: null,
      quiz: {
        factors: [],
        pairs: [],
        pairDraft: [],
        primes: [],
        wrong: { factors: 0, pairs: 0, primes: 0 },
        solved: { factors: false, pairs: false, primes: false }
      }
    };

    function factorsOf(n) {
      const result = [];
      for (let i = 1; i <= n; i += 1) {
        if (n % i === 0) result.push(i);
      }
      return result;
    }

    function factorPairs(n) {
      const pairs = [];
      for (let i = 1; i <= Math.sqrt(n); i += 1) {
        if (n % i === 0) pairs.push([i, n / i]);
      }
      return pairs;
    }

    function primeFactorsOf(n) {
      const result = [];
      let value = n;
      let divisor = 2;
      while (value > 1) {
        while (value % divisor === 0) {
          result.push(divisor);
          value /= divisor;
        }
        divisor += divisor === 2 ? 1 : 2;
      }
      return result.length ? result : [n];
    }

    function chooseNumber() {
      const richNumbers = Array.from({ length: 99 }, (_, i) => i + 2)
        .filter((n) => primeFactorsOf(n).length >= 2);
      return richNumbers[Math.floor(Math.random() * richNumbers.length)];
    }

    function sameNumberList(a, b) {
      if (a.length !== b.length) return false;
      const left = [...a].sort((x, y) => x - y);
      const right = [...b].sort((x, y) => x - y);
      return left.every((value, index) => value === right[index]);
    }

    function samePairs(a, b) {
      if (a.length !== b.length) return false;
      const normalize = (pairs) => pairs
        .map(([x, y]) => [Math.min(x, y), Math.max(x, y)].join("x"))
        .sort();
      const left = normalize(a);
      const right = normalize(b);
      return left.every((value, index) => value === right[index]);
    }

    function renderBoard() {
      board.innerHTML = "";
      for (let i = 1; i <= 100; i += 1) {
        const button = document.createElement("button");
        button.className = "number";
        button.type = "button";
        button.textContent = i;
        button.draggable = true;
        button.dataset.value = i;
        button.addEventListener("click", () => handleBoardNumber(i));
        button.addEventListener("dragstart", () => {
          state.draggedValue = i;
        });
        board.append(button);
      }
      updateSelectedButton();
    }

    function updateSelectedButton() {
      document.querySelectorAll(".number").forEach((button) => {
        const value = Number(button.dataset.value);
        button.classList.toggle("selected", value === state.current);
        button.classList.toggle("answer-source", state.mode === "quiz");
      });
    }

    function handleBoardNumber(value) {
      if (state.mode === "demo") {
        setNumber(value);
        return;
      }
      addQuizValue(state.activeTask, value);
    }

    function resetQuiz() {
      state.activeTask = "factors";
      state.locked = false;
      state.roundTime = state.roundLimit;
      stopTaskTimer();
      state.runningTask = null;
      state.taskTimes = { factors: state.taskLimit, pairs: state.taskLimit, primes: state.taskLimit };
      state.quiz = {
        factors: [],
        pairs: [],
        pairDraft: [],
        primes: [],
        wrong: { factors: 0, pairs: 0, primes: 0 },
        solved: { factors: false, pairs: false, primes: false }
      };
    }

    function setMode(mode) {
      if (mode === "demo") {
        state.active = false;
        state.locked = false;
        clearInterval(state.timer);
        stopTaskTimer();
      }
      state.mode = mode;
      demoModeButton.classList.toggle("active", mode === "demo");
      quizModeButton.classList.toggle("active", mode === "quiz");
      document.querySelector("#startGame").textContent = mode === "quiz" ? "▶ 開始測驗" : "▶ 開始挑戰";
      resetQuiz();
      renderChallenge();
      updateSelectedButton();
      showFeedback(mode === "demo"
        ? "第一版教學示範：點左邊數字，右邊會自動顯示答案。"
        : "第二版遊戲測驗：先點選任務卡，再用左邊數字作答或拖入作答區。", "");
    }

    function setNumber(n) {
      state.current = n;
      if (state.active && state.mode === "quiz") state.roundCount += 1;
      targetEl.textContent = n;
      speech.textContent = state.mode === "demo"
        ? `一起找出 ${n} 的因數與質因數分解吧！`
        : `測驗題目：完成 ${n} 的因數、因數配對與質因數分解。`;
      resetQuiz();
      renderChallenge();
      updateSelectedButton();
      updateHud();
    }

    function renderChallenge() {
      if (state.mode === "demo") {
        renderDemo();
      } else {
        renderQuiz();
      }
      markActiveTask();
    }

    function renderDemo() {
      const factors = factorsOf(state.current);
      const pairs = factorPairs(state.current);
      const primes = primeFactorsOf(state.current);

      contentEls.factors.innerHTML = "";
      const factorRow = document.createElement("div");
      factorRow.className = "chips";
      factors.forEach((factor) => factorRow.append(createChip(factor)));
      contentEls.factors.append(factorRow);

      contentEls.pairs.innerHTML = "";
      const pairRow = document.createElement("div");
      pairRow.className = "pair-list";
      pairs.forEach(([a, b]) => pairRow.append(createPair(`${a} × ${b}`)));
      contentEls.pairs.append(pairRow);

      contentEls.primes.innerHTML = "";
      const equation = document.createElement("div");
      equation.className = "equation";
      equation.append(document.createTextNode(`${state.current} = `));
      primes.forEach((prime, index) => {
        equation.append(createFactorBox(prime));
        if (index < primes.length - 1) equation.append(document.createTextNode(" × "));
      });
      contentEls.primes.append(equation);

      Object.keys(actionEls).forEach((task) => actionEls[task].innerHTML = "");
    }

    function renderQuiz() {
      renderQuizZone("factors", "點左邊數字，收集所有因數");
      renderQuizZone("pairs", "每兩個數字形成一組配對，例如 2 × 12");
      renderQuizZone("primes", "依序點出質因數，例如 2、2、2、3");
      renderTaskActions("factors");
      renderTaskActions("pairs");
      renderTaskActions("primes");
    }

    function renderQuizZone(task, placeholder) {
      const zone = document.createElement("div");
      zone.className = "quiz-zone answer-row";
      zone.dataset.task = task;
      zone.dataset.placeholder = placeholder;
      zone.addEventListener("dragover", (event) => event.preventDefault());
      zone.addEventListener("drop", (event) => {
        event.preventDefault();
        if (state.draggedValue) addQuizValue(task, state.draggedValue);
      });
      zone.addEventListener("click", () => setActiveTask(task));

      if (task === "pairs") {
        state.quiz.pairs.forEach((pair, index) => zone.append(createAnswerToken(pair.join(" × "), task, index)));
        state.quiz.pairDraft.forEach((value, index) => zone.append(createAnswerToken(value, "pairDraft", index)));
      } else {
        state.quiz[task].forEach((value, index) => zone.append(createAnswerToken(value, task, index, task === "primes" && value > 2)));
      }

      zone.classList.toggle("empty", zone.children.length === 0);
      contentEls[task].innerHTML = "";
      contentEls[task].append(zone);
    }

    function renderTaskActions(task) {
      actionEls[task].innerHTML = "";

      const note = document.createElement("div");
      note.className = "task-note";
      note.id = `${task}Note`;
      note.textContent = state.quiz.wrong[task] ? `錯誤 ${state.quiz.wrong[task]} / 3 次` : "作答後按確認。";

      const start = document.createElement("button");
      start.className = "task-start";
      start.type = "button";
      start.textContent = state.runningTask === task ? "倒數中" : "開始本題";
      start.disabled = state.quiz.solved[task];
      start.addEventListener("click", () => startTask(task));

      const taskTimer = document.createElement("div");
      taskTimer.className = `task-timer ${state.taskTimes[task] <= 8 && state.runningTask === task ? "danger" : ""}`;
      taskTimer.textContent = `${state.taskTimes[task]}s`;

      const clear = document.createElement("button");
      clear.className = "clear";
      clear.type = "button";
      clear.textContent = "清除";
      clear.addEventListener("click", () => clearTask(task));

      const confirm = document.createElement("button");
      confirm.className = "confirm";
      confirm.type = "button";
      confirm.textContent = "確認";
      confirm.disabled = state.runningTask !== task || state.quiz.solved[task];
      confirm.addEventListener("click", () => checkTask(task));

      actionEls[task].append(note, start, taskTimer, clear, confirm);
    }

    function createChip(value) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = value;
      return chip;
    }

    function createPair(text) {
      const pair = document.createElement("span");
      pair.className = "pair";
      pair.textContent = text;
      return pair;
    }

    function createFactorBox(value) {
      const box = document.createElement("span");
      box.className = `factor-box ${value > 2 ? "prime" : ""}`;
      box.textContent = value;
      return box;
    }

    function createAnswerToken(value, task, index, isPrime = false) {
      const token = document.createElement("button");
      token.className = `answer-token ${isPrime ? "prime" : ""}`;
      token.type = "button";
      token.textContent = value;
      token.title = "點一下可移除";
      token.addEventListener("click", (event) => {
        event.stopPropagation();
        removeQuizValue(task, index);
      });
      return token;
    }

    function setActiveTask(task) {
      state.activeTask = task;
      markActiveTask();
      showFeedback(`目前作答：${taskName(task)}。點左邊數字或拖曳到作答區。`, "");
    }

    function markActiveTask() {
      document.querySelectorAll("[data-task]").forEach((section) => {
        section.classList.toggle("active-task", state.mode === "quiz" && section.dataset.task === state.activeTask);
      });
    }

    function addQuizValue(task, value) {
      if (state.mode !== "quiz") return;
      if (state.locked) {
        showFeedback("這題已暫停作答，準備進入下一題。", "bad");
        return;
      }
      if (state.runningTask !== task) {
        setActiveTask(task);
        showTaskNote(task, "請先按「開始本題」再作答。", "bad");
        showFeedback("每個小題要分開開始，倒數與滴答聲才會啟動。", "bad");
        return;
      }
      setActiveTask(task);
      if (state.quiz.solved[task]) {
        showTaskNote(task, "這一題已答對，可以挑戰其他區。", "good");
        return;
      }

      if (task === "factors") {
        if (!state.quiz.factors.includes(value)) state.quiz.factors.push(value);
      } else if (task === "pairs") {
        state.quiz.pairDraft.push(value);
        if (state.quiz.pairDraft.length === 2) {
          state.quiz.pairs.push([...state.quiz.pairDraft]);
          state.quiz.pairDraft = [];
        }
      } else {
        state.quiz.primes.push(value);
      }
      renderQuiz();
      setActiveTask(task);
    }

    function removeQuizValue(task, index) {
      if (task === "pairDraft") {
        state.quiz.pairDraft.splice(index, 1);
        task = "pairs";
      } else {
        state.quiz[task].splice(index, 1);
      }
      renderQuiz();
      setActiveTask(task);
    }

    function clearTask(task) {
      state.quiz[task] = [];
      if (task === "pairs") state.quiz.pairDraft = [];
      renderQuiz();
      setActiveTask(task);
      showTaskNote(task, "已清除，可以重新作答。", "");
    }

    function checkTask(task) {
      if (state.locked) return;
      if (state.runningTask !== task) {
        setActiveTask(task);
        showTaskNote(task, "請先按「開始本題」再確認。", "bad");
        showFeedback("每個小題都有自己的倒數，先開始該小題。", "bad");
        return;
      }
      const correct = isTaskCorrect(task);
      if (correct) {
        state.quiz.solved[task] = true;
        stopTaskTimer();
        state.streak += 1;
        state.maxStreak = Math.max(state.maxStreak, state.streak);
        addScore(task === "pairs" ? 18 : 14);
        adjustTime(2, "答對 +2 秒");
        launchCheer(Object.values(state.quiz.solved).every(Boolean) ? "過關！" : "答對了！");
        showTaskNote(task, "正確！", "good");
        showFeedback(`${taskName(task)}答對了，時間 +2 秒，繼續完成其他區。`, "good");
        if (Object.values(state.quiz.solved).every(Boolean)) completeQuizRound();
        return;
      }

      state.streak = 0;
      state.quiz.wrong[task] += 1;
      adjustTime(-3, "答錯 -3 秒");
      updateHud();
      if (state.quiz.wrong[task] >= 3) {
        revealAnswer(task);
        state.quiz.solved[task] = true;
        stopTaskTimer();
        adjustTime(-5, "錯三次 -5 秒");
        showTaskNote(task, "錯三次，已顯示正確答案。", "bad");
        showFeedback(`${taskName(task)}已揭曉答案，時間再 -5 秒。`, "bad");
        if (Object.values(state.quiz.solved).every(Boolean)) completeQuizRound();
      } else {
        const section = document.querySelector(`[data-task="${task}"]`);
        section.classList.remove("shake");
        void section.offsetWidth;
        section.classList.add("shake");
        showTaskNote(task, `不正確，錯誤 ${state.quiz.wrong[task]} / 3 次。`, "bad");
        showFeedback("再想一下，第三次錯誤會直接顯示答案。", "bad");
      }
    }

    function isTaskCorrect(task) {
      if (task === "factors") return sameNumberList(state.quiz.factors, factorsOf(state.current));
      if (task === "pairs") return state.quiz.pairDraft.length === 0 && samePairs(state.quiz.pairs, factorPairs(state.current));
      return JSON.stringify(state.quiz.primes) === JSON.stringify(primeFactorsOf(state.current));
    }

    function revealAnswer(task) {
      if (task === "factors") {
        state.quiz.factors = factorsOf(state.current);
      } else if (task === "pairs") {
        state.quiz.pairs = factorPairs(state.current);
        state.quiz.pairDraft = [];
      } else {
        state.quiz.primes = primeFactorsOf(state.current);
      }
      renderQuiz();
      setActiveTask(task);
    }

    function showTaskNote(task, message, type) {
      const note = document.querySelector(`#${task}Note`);
      if (!note) return;
      note.textContent = message;
      note.className = `task-note ${type}`;
    }

    function taskName(task) {
      return { factors: "因數", pairs: "因數配對", primes: "質因數分解" }[task];
    }

    function completeQuizRound() {
      if (state.locked) return;
      state.locked = true;
      const speedBonus = state.active ? Math.max(2, Math.ceil(state.roundTime / 4)) : 2;
      addScore(24 + speedBonus);
      adjustTime(5, "整題完成 +5 秒");
      targetEl.classList.remove("flash");
      void targetEl.offsetWidth;
      targetEl.classList.add("flash");
      showFeedback(`三個任務完成！速度獎勵 +${speedBonus} 分，時間 +5 秒。`, "good");
      if (state.active) setTimeout(() => setNumber(chooseNumber()), 1000);
    }

    function addScore(points) {
      if (!state.active && state.mode === "quiz") return;
      state.score += points;
      updateHud();
    }

    function totalTimeRemaining() {
      return Object.values(state.taskTimes).reduce((sum, value) => sum + value, 0);
    }

    function startTask(task) {
      if (state.mode !== "quiz") setMode("quiz");
      if (state.quiz.solved[task]) {
        showTaskNote(task, "這個小題已完成。", "good");
        return;
      }
      state.active = true;
      state.locked = false;
      setActiveTask(task);
      stopTaskTimer();
      state.runningTask = task;
      state.roundTime = state.taskTimes[task];
      if (!state.muted) ensureAudio();
      showTaskNote(task, "倒數開始！", "good");
      showFeedback(`${taskName(task)}開始倒數，完成後按確認。`, "good");
      renderTaskActions("factors");
      renderTaskActions("pairs");
      renderTaskActions("primes");
      state.taskTimer = setInterval(() => {
        state.taskTimes[task] -= 1;
        state.roundTime = state.taskTimes[task];
        state.time = totalTimeRemaining();
        playTick();
        updateHud();
        renderTaskActions(task);
        if (state.taskTimes[task] <= 0) handleRoundTimeout(task);
      }, 1000);
    }

    function stopTaskTimer() {
      clearInterval(state.taskTimer);
      state.taskTimer = null;
      state.runningTask = null;
    }

    function adjustTime(delta, reason) {
      if (!state.active) return;
      const task = state.runningTask || state.activeTask;
      state.taskTimes[task] = Math.max(0, Math.min(state.taskLimit, state.taskTimes[task] + delta));
      state.roundTime = state.taskTimes[task];
      state.time = totalTimeRemaining();
      updateHud();
      if (state.taskTimes[task] <= 0 && state.runningTask === task) handleRoundTimeout(task);
    }

    function handleRoundTimeout(task = state.runningTask || state.activeTask) {
      if (!state.active || state.locked) return;
      stopTaskTimer();
      state.streak = 0;
      revealAnswer(task);
      state.quiz.solved[task] = true;
      updateHud();
      showTaskNote(task, "小題時間到，已顯示正確答案。", "bad");
      showFeedback(`${taskName(task)}時間到！請開始下一個小題。`, "bad");
      if (Object.values(state.quiz.solved).every(Boolean)) completeQuizRound();
    }

    function updateHud() {
      scoreEl.textContent = state.score;
      streakEl.textContent = state.streak;
      state.time = totalTimeRemaining();
      timeEl.textContent = state.time;
      roundTimeEl.textContent = state.runningTask ? state.taskTimes[state.runningTask] : state.taskTimes[state.activeTask];
      roundCountEl.textContent = state.roundCount;
      timerBox.classList.toggle("danger", state.time <= 10 && state.active);
      roundTimerBox.classList.toggle("danger", state.runningTask && state.taskTimes[state.runningTask] <= 8 && state.active);
    }

    function showFeedback(message, type) {
      feedback.textContent = message;
      feedback.className = `feedback ${type}`;
    }

    function ensureAudio() {
      if (state.audio) return state.audio;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return null;
      state.audio = new AudioContext();
      return state.audio;
    }

    function playTone(frequency, duration = .08, gainValue = .08, type = "sine") {
      if (state.muted) return;
      const audio = ensureAudio();
      if (!audio) return;
      if (audio.state === "suspended") audio.resume();
      const oscillator = audio.createOscillator();
      const gain = audio.createGain();
      oscillator.type = type;
      oscillator.frequency.value = frequency;
      gain.gain.setValueAtTime(0.0001, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(gainValue, audio.currentTime + .01);
      gain.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + duration);
      oscillator.connect(gain).connect(audio.destination);
      oscillator.start();
      oscillator.stop(audio.currentTime + duration + .02);
    }

    function playTick() {
      if (!state.runningTask) return;
      const urgent = state.taskTimes[state.runningTask] <= 8;
      state.tickTone = 1 - state.tickTone;
      playTone(urgent ? 1040 : state.tickTone ? 720 : 560, urgent ? .07 : .045, urgent ? .12 : .055, "square");
    }

    function playCheerSound() {
      playTone(660, .08, .09, "triangle");
      setTimeout(() => playTone(880, .09, .1, "triangle"), 80);
      setTimeout(() => playTone(1180, .12, .11, "triangle"), 170);
    }

    function launchCheer(text = "答對了！") {
      playCheerSound();
      const burst = document.createElement("div");
      burst.className = "cheer-burst";

      const word = document.createElement("div");
      word.className = "cheer-word";
      word.textContent = text;
      burst.append(word);

      const colors = ["#50a9ff", "#63df93", "#f79bdc", "#ffd86a", "#ffb650", "#ffffff"];
      for (let i = 0; i < 34; i += 1) {
        const piece = document.createElement("i");
        piece.className = "confetti";
        const angle = (Math.PI * 2 * i) / 34;
        const distance = 130 + Math.random() * 250;
        piece.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
        piece.style.setProperty("--dy", `${Math.sin(angle) * distance + 180}px`);
        piece.style.setProperty("--rot", `${Math.random() * 720 - 360}deg`);
        piece.style.left = `${42 + Math.random() * 16}%`;
        piece.style.top = `${22 + Math.random() * 18}%`;
        piece.style.background = colors[i % colors.length];
        piece.style.animationDelay = `${Math.random() * .16}s`;
        burst.append(piece);
      }

      document.body.append(burst);
      setTimeout(() => burst.remove(), 1300);
    }

    function toggleMute() {
      state.muted = !state.muted;
      muteToggle.textContent = state.muted ? "🔇 靜音" : "🔊 音效開";
      showFeedback(state.muted ? "已切換為靜音模式。" : "音效已開啟。", "");
    }

    function startGame() {
      setMode("quiz");
      state.score = 0;
      state.streak = 0;
      state.maxStreak = 0;
      state.taskTimes = { factors: state.taskLimit, pairs: state.taskLimit, primes: state.taskLimit };
      state.time = totalTimeRemaining();
      state.roundTime = state.taskLimit;
      state.roundCount = 0;
      state.locked = false;
      state.active = true;
      modal.classList.remove("open");
      clearInterval(state.timer);
      stopTaskTimer();
      setNumber(chooseNumber());
      updateHud();
      showFeedback("測驗開始！請在每個小題按「開始本題」，倒數與滴答聲會分開啟動。", "good");
    }

    function endGame() {
      state.active = false;
      clearInterval(state.timer);
      updateHud();
      modalText.textContent = `你的分數是 ${state.score} 分，最高連擊 ${state.maxStreak}。`;
      modal.classList.add("open");
      showFeedback("時間到！按再挑戰一次重新開始。", "bad");
    }

    document.querySelector("#newRound").addEventListener("click", () => setNumber(chooseNumber()));
    document.querySelector("#startGame").addEventListener("click", startGame);
    document.querySelector("#restart").addEventListener("click", startGame);
    muteToggle.addEventListener("click", toggleMute);
    demoModeButton.addEventListener("click", () => setMode("demo"));
    quizModeButton.addEventListener("click", () => setMode("quiz"));

    renderBoard();
    setNumber(24);
    updateHud();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
